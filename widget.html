<!doctype html><html lang="en"><head><meta charset="utf-8"><style>*{box-sizing:border-box}body{margin:0;padding:14px;background:transparent;color:var(--text);font:12px/1.5 -apple-system,BlinkMacSystemFont,system-ui,sans-serif}.top{display:flex;justify-content:space-between;align-items:center}.n{font-size:30px;font-weight:650;letter-spacing:-1px}.muted{color:var(--muted)}button{background:var(--accent);color:#171321;border:0;padding:9px 13px;border-radius:10px;font:inherit;cursor:pointer}.thumbs{display:flex;gap:8px;margin-top:12px}.thumbs img{width:52px;height:52px;object-fit:cover;border-radius:9px}.small .thumbs{display:none}.small .n{font-size:27px}</style></head><body><div class="top"><div><div class="n" id="count">0</div><div class="muted" id="summary">A fresh canvas</div></div><button id="open">Create ↗</button></div><div class="thumbs" id="thumbs"></div><script>document.body.className=orbit.widget?.size||'medium';document.getElementById('open').onclick=()=>orbit.open();async function show(a,j,data={}){a=(a||[]).filter(x=>!x.archived);document.getElementById('count').textContent=a.length;const n=(j||[]).filter(x=>['queued','working'].includes(x.status)).length;document.getElementById('summary').textContent=n?n+' in the making':a.length?'Images, ideas and possibilities':'Your next idea starts here';const el=document.getElementById('thumbs');el.replaceChildren();for(const v of a.slice(-3).reverse()){const d=data[v.previewKey||'preview_'+v.id];if(!d)continue;const im=document.createElement('img');im.src=typeof d==='string'?d:d.dataUrl;im.alt=v.title;el.append(im)}}orbit.data.all().then(d=>show(d.assets,d.jobs,d));orbit.onChange(d=>show(d.assets,d.jobs,d));</script></body></html>
